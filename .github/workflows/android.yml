name: Compilar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Preparar la app web
        run: |
          exec > >(tee -a "$RUNNER_TEMP/registro.txt") 2>&1
          npm ci
          npm run build
          npx cap sync android

      - name: Cargar la llave de firma (si existe)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PW"
              echo "ANDROID_KEY_ALIAS=upload"
              echo "ANDROID_KEY_PASSWORD=$KS_PW"
              echo "SIGNED=1"
            } >> "$GITHUB_ENV"
            echo "Llave de firma cargada."
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD. Solo se compila el APK de prueba."
          fi

      - name: Compilar
        working-directory: android
        run: |
          exec > >(tee -a "$RUNNER_TEMP/registro.txt") 2>&1
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Ordenar archivos
        run: |
          V=$(node -p "require('./package.json').version")
          N="MiPrimerAcuario-v${V}-build${VERSION_CODE}"
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk "salida/${N}-prueba.apk"
          if [ "$SIGNED" = "1" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "salida/${N}-google-play.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "salida/${N}-instalable.apk"
          fi
          ls -la salida
          echo "NOMBRE=${N}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NOMBRE }}
          path: salida/*
          retention-days: 30

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${VERSION_CODE}"
          if [ "$SIGNED" = "1" ]; then
            NOTAS="Compilación ${VERSION_CODE} de Mi Primer Acuario.

          - *-google-play.aab → el archivo que se sube a Google Play Console.
          - *-instalable.apk → firmado, para instalar en cualquier Android o subir a otras tiendas (Samsung, Huawei).
          - *-prueba.apk → versión de prueba."
          else
            NOTAS="Compilación ${VERSION_CODE} (solo APK de prueba: faltan los secretos de firma)."
          fi
          gh release create "$TAG" salida/* --title "Mi Primer Acuario · compilación ${VERSION_CODE}" --notes "$NOTAS" --target "$GITHUB_SHA"

      - name: Publicar el registro si algo falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch "$RUNNER_TEMP/registro.txt"
          tail -c 900000 "$RUNNER_TEMP/registro.txt" > registro-fallo.txt
          gh release create "fallo-${VERSION_CODE}" registro-fallo.txt --prerelease --title "Registro de la compilación ${VERSION_CODE} (falló)" --notes "Registro para revisar el error." --target "$GITHUB_SHA"
