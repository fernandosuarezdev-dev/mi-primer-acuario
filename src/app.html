<title>Mi Primer Acuario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: deliberate single dark "aquarium room at night" look. The live, simulated aquarium is the hero and the place where every chore happens.
   Phone: bottom glass nav, tool belt under the tank, stacked cards, bottom sheets. Desktop (>=980px): tank + tools left, needs + fish right. */
:root{
  --abyss:#03111A; --ink:#E8F7F8; --muted:#8DB3B9; --dim:#5F8890;
  --line:rgba(150,230,240,.13); --line-2:rgba(150,230,240,.26);
  --card-a:rgba(24,78,96,.52); --card-b:rgba(8,36,48,.62);
  --accent:#40E0E8; --accent-2:#1FA9C9; --accent-ink:#022A33; --accent-soft:rgba(64,224,232,.14);
  --coral:#FF7A6E; --gold:#FFC857; --violet:#A99BFF;
  --ok:#4BE3A0; --ok-soft:rgba(75,227,160,.14); --warn:#FFC857; --warn-soft:rgba(255,200,87,.14); --crit:#FF6B6B; --crit-soft:rgba(255,107,107,.15);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--abyss)}
body{background:var(--abyss);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;min-height:100%}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .hint{font-size:13px;color:var(--muted);font-weight:400}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:18px;height:18px} .ico.l{width:28px;height:28px}

.ocean{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(130% 55% at 50% -12%,rgba(46,170,190,.38),transparent 62%),radial-gradient(70% 45% at 100% 100%,rgba(40,90,170,.22),transparent 70%),linear-gradient(180deg,#05293A 0%,#041A26 45%,#03111A 100%)}
.rays{position:absolute;inset:-10% -30% 25% -30%;background:repeating-linear-gradient(105deg,rgba(140,235,245,.05) 0 60px,transparent 60px 170px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%)}
.snow i{position:absolute;top:0;border-radius:50%;background:rgba(200,240,245,.32)}
@media (prefers-reduced-motion:no-preference){
  .rays{animation:rays 16s ease-in-out infinite alternate}@keyframes rays{to{transform:translateX(90px) skewX(-5deg)}}
  .snow i{animation:snow linear infinite}@keyframes snow{from{transform:translate(0,-5vh)}to{transform:translate(30px,105vh)}}
}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.wrap{padding-block:0 100px}}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,#5CF0F2,#1A86B8);box-shadow:0 8px 22px -8px rgba(64,224,232,.7);flex:none}
.logo svg{width:28px;height:17px}
.word{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.015em;white-space:nowrap}
.word span{color:var(--accent);font-weight:500}
@media (max-width:380px){.word span{display:none}}
.top-r{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(3,20,28,.5);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn);animation:blink 1s infinite} .sync.local i{background:var(--accent)} .sync.off i{background:var(--crit)}
@keyframes blink{50%{opacity:.3}}
@media (max-width:460px){.sync span{display:none}.sync{padding:10px}}
.iconbtn{appearance:none;border:1px solid var(--line);background:rgba(3,20,28,.45);width:42px;height:42px;border-radius:14px;cursor:pointer;display:inline-grid;place-items:center;color:var(--ink);flex:none;transition:transform .15s,background .2s}
.iconbtn:hover{background:rgba(64,224,232,.12)} .iconbtn:active{transform:scale(.92)}
.iconbtn.sm{width:36px;height:36px;border-radius:11px;font-size:20px;font-weight:700;line-height:1}

.tabs{display:none}
@media (min-width:760px){.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;margin-bottom:18px;padding:6px;border-radius:18px;background:rgba(3,20,28,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);width:fit-content}}
.tab{appearance:none;background:none;border:0;padding:10px 16px;border-radius:13px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:background .25s,color .25s}
.tab[aria-selected="true"]{color:var(--accent-ink);background:linear-gradient(135deg,#5CF0F2,#22B4CF)}
.badge{font-family:var(--font-data);font-size:11.5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--coral);color:#2A0603;display:inline-grid;place-items:center;line-height:1;font-weight:500}
.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(4,24,33,.8);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line-2);border-radius:24px;padding:6px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
@media (min-width:760px){.bnav{display:none}}
.bn-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:linear-gradient(135deg,rgba(64,224,232,.26),rgba(31,169,201,.14));border:1px solid rgba(64,224,232,.35);transform:translateX(calc(var(--i,0)*100%));transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.bn{position:relative;z-index:1;appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:color .25s}
.bn .ico{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.bn[aria-selected="true"]{color:var(--accent)} .bn[aria-selected="true"] .ico{transform:translateY(-2px) scale(1.12)}
.bn .badge{position:absolute;top:2px;left:calc(50% + 6px)}

.card{position:relative;background:linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 24px 50px -28px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.h-xl{font-size:clamp(28px,7.5vw,44px);font-weight:800;letter-spacing:-.025em}
.h-lg{font-size:clamp(20px,5vw,25px);font-weight:800;letter-spacing:-.015em}
.h-md{font-size:18px;font-weight:700}
.grad{background:linear-gradient(100deg,#E8F7F8 10%,#7FF1F4 60%,#40C8E8);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{appearance:none;font-weight:700;font-size:15px;min-height:46px;padding:10px 18px;border-radius:15px;border:1px solid var(--line-2);background:rgba(3,20,28,.45);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{background:rgba(64,224,232,.1)} .btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#5CF0F2,#1FA9C9);border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 26px -10px rgba(64,224,232,.75)}
.btn.sm{font-size:14px;min-height:38px;padding:7px 13px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:9px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(150,230,240,.1);color:var(--ink);white-space:nowrap;border:1px solid var(--line)}
.chip.nat{background:rgba(255,122,110,.18);color:#FFB2A8;border-color:rgba(255,122,110,.35)}
.chip.lv1{background:var(--ok-soft);color:var(--ok)} .chip.lv2{background:var(--warn-soft);color:var(--warn)} .chip.lv3{background:var(--crit-soft);color:var(--crit)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:linear-gradient(135deg,#FFD66B,#FF9A3D);color:#2B1500;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}
.fbtn{appearance:none;border:1px solid var(--line-2);background:rgba(3,20,28,.45);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap;min-height:40px;transition:all .2s}
.fbtn[aria-pressed="true"]{background:linear-gradient(135deg,#5CF0F2,#22B4CF);color:var(--accent-ink);border-color:transparent}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}

.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--muted);min-width:0}
.inp{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line-2);border-radius:14px;background:rgba(2,16,22,.6);color:var(--ink);font-weight:400;font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px rgba(64,224,232,.15)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:12px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:700;font-size:15px;min-height:44px;padding:10px 12px;border-radius:14px;background:rgba(3,20,28,.4);border:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.check small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.err{font-size:13.5px;color:var(--crit);font-weight:700}
.switch{appearance:none;width:52px;height:30px;border-radius:15px;background:rgba(150,230,240,.18);position:relative;cursor:pointer;border:1px solid var(--line-2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.switch:checked{background:var(--accent)} .switch:checked::after{transform:translateX(22px)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.seg{display:flex;gap:4px;padding:4px;background:rgba(3,20,28,.55);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;flex:1 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:40px;transition:all .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,rgba(64,224,232,.3),rgba(31,169,201,.14));color:var(--ink)}
.opt{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:18px;border:1px solid var(--line-2);background:rgba(3,20,28,.45);cursor:pointer;color:var(--ink);transition:border-color .2s,background .2s}
.opt[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(135deg,rgba(64,224,232,.18),rgba(3,20,28,.4))}
.opt .oi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.opt small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}

.ringbox{position:relative;display:inline-grid;place-items:center;flex:none}
.ringbox .lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring-bg{fill:none;stroke:rgba(150,230,240,.12)}
.ring-fg{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.3,1,.4,1)}
.bar{height:9px;border-radius:5px;background:rgba(150,230,240,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width 1s cubic-bezier(.3,1,.4,1)}
.bar.ok i{background:linear-gradient(90deg,#2BB880,var(--ok))} .bar.warn i{background:linear-gradient(90deg,#E89A2E,var(--warn))} .bar.crit i{background:linear-gradient(90deg,#E8455A,var(--crit))} .bar.gold i{background:linear-gradient(90deg,#FF9A3D,#FFD66B)}
@media (prefers-reduced-motion:no-preference){
  .enter .ci{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
  @keyframes rise{from{transform:translateY(22px);opacity:.25}to{transform:none;opacity:1}}
}

/* stage */
.stage{position:relative;border-radius:30px;overflow:hidden;height:clamp(290px,56vh,520px);border:1px solid var(--line-2);box-shadow:0 34px 70px -30px rgba(0,0,0,.95);background:#0C4E61;isolation:isolate}
.stage.demo{height:clamp(260px,62vw,420px)}
@media (min-width:980px){.stage{height:500px}}
.aq{position:absolute;inset:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.aq.sponge{cursor:grab;touch-action:none}
.aq canvas{width:100%;height:100%;display:block}
.st-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:2}
.st-col{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hud{display:inline-flex;align-items:center;gap:6px;background:rgba(3,20,28,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.hud b{font-weight:500;font-family:var(--font-data)}
.hud.meh{border-color:rgba(255,200,87,.6);color:var(--warn)} .hud.bad{border-color:rgba(255,107,107,.7);color:var(--crit)}
.hud.spd{background:linear-gradient(135deg,rgba(169,155,255,.9),rgba(120,100,240,.9));color:#140A3A;border-color:transparent}
.st-bot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.st-tip{font-size:13px;font-weight:700;color:#E8F7F8;background:rgba(3,20,28,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);display:inline-flex;gap:7px;align-items:center;text-align:center}
@media (prefers-reduced-motion:no-preference){.st-tip.pulse{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{opacity:.55}}}

/* tool belt */
.toolbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;padding:6px 16px 6px}
.toolbar::-webkit-scrollbar{display:none}
.tool{appearance:none;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;border:0;background:none;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;position:relative;line-height:1.15;text-align:center}
.tool .tb{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,rgba(3,20,28,.65));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s}
.tool .tb .ico{width:26px;height:26px}
.tool:active .tb{transform:scale(.9)}
.tool[aria-pressed="true"] .tb{background:var(--c);color:#032430;box-shadow:0 10px 24px -8px var(--c);transform:translateY(-3px)}
.tool .nd{position:absolute;top:-3px;right:6px;width:14px;height:14px;border-radius:50%;background:var(--warn);border:2.5px solid var(--abyss)}
.tool .nd.crit{background:var(--crit)}
@media (prefers-reduced-motion:no-preference){.tool .nd.crit{animation:blink 1s infinite}}

/* meters */
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.meters{grid-template-columns:repeat(6,1fr)}}
.meter{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:18px;background:rgba(3,20,28,.4);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);text-align:center;min-width:0}
.meter .num{font-size:12px}

.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.lvchip{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:rgba(3,20,28,.5);border:1px solid var(--line-2);cursor:pointer;color:var(--ink);appearance:none}
.lvchip .lvn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:#2B1500;background:radial-gradient(circle at 35% 30%,#FFF1B8,#FFC857 45%,#E8862E)}
.lvchip .bar{width:90px;height:6px;margin-top:3px}
.tchip{appearance:none;display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line-2);background:rgba(3,20,28,.45);cursor:pointer;font-weight:700;color:var(--ink);min-height:46px}
.tchip[aria-pressed="true"]{background:linear-gradient(135deg,rgba(64,224,232,.25),rgba(31,169,201,.1));border-color:rgba(64,224,232,.55)}
.tchip .tart{width:34px;height:34px;border-radius:50%}
.home-grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:980px){.home-grid{grid-template-columns:1.25fr 1fr;align-items:start}}
.home-grid>.stack{min-width:0}

/* needs */
.needs{display:flex;flex-direction:column;gap:8px}
.need{border-radius:18px;border:1px solid var(--line);background:rgba(5,30,40,.88);overflow:hidden}
.need.crit{border-color:rgba(255,107,107,.55);background:linear-gradient(90deg,rgba(255,107,107,.16),rgba(5,30,40,.88) 60%)}
.need.warn{border-color:rgba(255,200,87,.45);background:linear-gradient(90deg,rgba(255,200,87,.12),rgba(5,30,40,.88) 60%)}
.need-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 12px}
.ni{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.need b{display:block;font-size:15.5px}
.need .why{appearance:none;border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 0;cursor:pointer}
.need p.lesson{padding:0 14px 13px 68px;font-size:14px;color:#CFE6E8}
.need .sev{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.need.crit .sev{color:var(--crit)} .need.warn .sev{color:var(--warn)} .need.info .sev{color:var(--accent)}
.allok{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(110deg,rgba(75,227,160,.2),rgba(64,224,232,.08));border:1px solid rgba(75,227,160,.4)}
.allok .ico{color:var(--ok)}

/* fish groups */

const SPECIES=[
S('betta','Betta (pez luchador)','Betta splendens','luchador siames',[24,30],[6,7.5],[4,15],20,1,6.5,'3–5','semi','car',2,1,'sup',{solo:'Dos machos de betta pelean hasta herirse: deja un solo macho por acuario.',longfin:1,jump:1,tips:['Necesita calentador y poca corriente: sus aletas largas lo cansan.','Es carnívoro: bolitas para betta, artemia o larvas, en porciones pequeñas para evitar estreñimiento.','No lo juntes con peces que muerden aletas, como barbos o tetras serpae.']}),

S('corydoras','Corydoras','Corydoras spp.','cory coridora limpiafondos',[22,27],[6,7.8],[2,20],60,6,6,'5–10','pac','omn',2,1,'fon',{nat:1,tips:['Fondo de arena fina o grava redondeada: la grava filosa daña sus barbillas.','No vive de las sobras: dale pastillas que se hundan.','Sensible al cobre y a la sal: usa media dosis de medicamentos.']}),

S('perla','Gourami perla','Trichopodus leerii','gurami perlado',[24,28],[6,7.5],[5,19],120,2,11,'5–8','pac','omn',2,1,'sup',{tips:['De los gouramis más pacíficos.','Respira aire de la superficie: no llenes el acuario hasta el tope.']}),
S('convicto','Cíclido convicto','Amatitlania nigrofasciata','convicto cebra',[22,28],[6.5,8],[6,20],120,1,13,'10','agr','omn',2,1,'fon',{w:1.2,prey:3,tips:['Muy territorial, sobre todo cuando cría.','Se reproduce con facilidad: ten un plan para las crías.']}),
S('oscar','Óscar','Astronotus ocellatus','oscar tigre',[23,28],[6,8],[5,19],300,1,33,'10–20','semi','car',1,2,'med',{w:1.8,prey:12,nat:1,tips:['Se come cualquier pez que le quepa en la boca.','Muy sucio: filtro potente y cambios de agua de 30 a 40% semanales.','Reconoce a su dueño y suele mover la decoración.']}),
S('ramirezi','Ramirezi (cíclido mariposa)','Mikrogeophagus ramirezi','ram mariposa',[26,30],[5,7],[1,8],60,2,6,'2–4','pac','omn',2,3,'fon',{nat:1,tips:['Nativo de los llanos del Orinoco, en Colombia y Venezuela.','Necesita agua cálida, blanda y muy estable: no lo pongas en un acuario recién montado.']}),

S('fantasma','Tetra fantasma negro','Hyphessobrycon megalopterus','monja fantasma',[22,28],[6,7.5],[2,18],60,6,4.5,'5','pac','omn',2,1,'med',{tips:['Pacífico y fácil; los machos hacen exhibiciones sin hacerse daño.']}),

    if(preds.length){let eaten=0;for(const f of alive(S)){if(f.sz>=.55)continue;if(Math.random()<.006*h*(tank.planted?.35:1)){S.fish=S.fish.filter(x=>x!==f);eaten++}}if(eaten)diary(tank,S,'info','Algunas crías fueron comidas','Es normal en un acuario comunitario. Si quieres criarlas, usa plantas densas o un acuario aparte.','fry',24)}}

function compStress(tank,S){
  const a=analyze(tank,fishCounts(S));
  alive(S).forEach(f=>{const sp=getSp(f.sp);if(!sp)return;let v=0;a.issues.forEach(i=>{if(i.sev!=='info'&&i.msg.includes(sp.n))v+=i.msg.startsWith(sp.n)?0:.25});f.agg=Math.min(1.2,v)});
}
function advance(tank,S,h){
  if(!(h>0))return;h=Math.min(h,24*45);compStress(tank,S);
  while(h>0){const st=Math.min(.25,h);simStep(tank,S,st);h-=st}
}
let tickErr=false;
function simTickAll(){
  if(!ui.loaded||sync.mode==='pending')return;
  try{
    const now=Date.now(),sp=Number(set().speed)||1;let changed=false,away=null;
    for(const tank of state.core.tanks){
      let S=simOf(tank.id);if(!S){S=state.sim.tanks[tank.id]=newSim(tank,true);changed=true}
      const el=(now-S.t)/1000;if(el<.9)continue;
      const isAway=el>120;const h=isAway?el/3600:el*sp/3600;S.t=now;
      if(isAway&&h>.4){catchLog=[];const before={hun:avg(alive(S),'hun'),n:alive(S).length,alg:avg(S.algae)};advance(tank,S,h);away=away||[];away.push({tank,h,log:catchLog,before,after:{hun:avg(alive(S),'hun'),n:alive(S).length,alg:avg(S.algae)}});catchLog=null}
      else advance(tank,S,h);
      changed=true;
    }
    if(changed){simDirty=true;liveUpdate()}
    if(away&&!ui.sheet){ui.away=away;openSheet({type:'away'})}
  }catch(e){catchLog=null;if(!tickErr){tickErr=true;console.error(e)}}
}
let lastSave=Date.now();
setInterval(()=>{simTickAll();if(simDirty&&Date.now()-lastSave>20000)saveSim()},1000);
function saveSim(){simDirty=false;lastSave=Date.now();queueSave(['sim'].concat([...dirtyYears].map(y=>'logs-'+y)));dirtyYears.clear()}
function act(ids){simDirty=false;lastSave=Date.now();commit(['sim','core'].concat(ids||[]).concat([...dirtyYears].map(y=>'logs-'+y)));dirtyYears.clear()}

/* ================= Análisis ================= */
function analyze(tank,fishList){
  const groups={};(fishList||[]).forEach(f=>{groups[f.sp]=(groups[f.sp]||0)+Number(f.count||0)});
  const items=Object.keys(groups).map(id=>({sp:getSp(id),count:groups[id]})).filter(x=>x.sp&&x.count>0);
  const L=Number(tank.L)||0;
  const res={items,issues:[],t:null,ph:null,gh:null,load:0,cm:0,feeds:1,total:0,lim:40};
  if(!items.length)return res;
  res.total=items.reduce((a,i)=>a+i.count,0);
  const add=(sev,msg)=>{if(!res.issues.some(x=>x.msg===msg))res.issues.push({sev,msg})};
  function inter(key,label,unit,sev){
    const a=items.reduce((m,i)=>i.sp[key][0]>m.sp[key][0]?i:m),b=items.reduce((m,i)=>i.sp[key][1]<m.sp[key][1]?i:m);
    const lo=a.sp[key][0],hi=b.sp[key][1];
    if(lo>hi){add(sev,`${label} incompatible: ${a.sp.n} necesita desde ${fmtN(lo)}${unit} y ${b.sp.n} máximo ${fmtN(hi)}${unit}.`);return null}
    return[lo,hi];
  }
  res.t=inter('t','Temperatura',' °C','crit');res.ph=inter('ph','pH','','warn');res.gh=inter('gh','Dureza (GH)',' dGH','info');
  items.forEach(i=>{const s=i.sp;
    if(L&&L<s.L)add(L<s.L*.6?'crit':'warn',`${s.n} necesita un acuario de al menos ${fmtN(s.L)} L (este tiene ${fmtN(L)} L).`);
    if(s.solo&&i.count>1)add('warn',s.solo);
    else if(!s.solo&&i.count<s.g)add('warn',`${s.n} vive en grupo: tienes ${i.count}, lo mínimo son ${s.g}.`);
  });
  items.forEach(a=>items.forEach(b=>{if(a===b)return;
    if(a.sp.prey&&b.sp.cm<=a.sp.prey)add('crit',`${a.sp.n} puede comerse a ${b.sp.n}.`);
    if(a.sp.nip&&b.sp.longfin)add('warn',`${a.sp.n} suele morder las aletas largas de ${b.sp.n}.`);
    if(a.sp.tp==='agr'&&b.sp.tp==='pac')add('warn',`${a.sp.n} es agresivo y puede acosar a ${b.sp.n}.`);
  }));
  res.cm=items.reduce((a,i)=>a+i.sp.cm*i.count*i.sp.w,0);res.load=L?res.cm/L:0;
  if(res.load>1.8)add('crit',`Sobrepoblado: unos ${Math.round(res.cm)} cm de peces adultos en ${fmtN(L)} L.`);
  else if(res.load>1.2)add('warn',`Carga alta: unos ${Math.round(res.cm)} cm de peces adultos en ${fmtN(L)} L. Ensuciarán el agua rápido.`);
  res.lim=items.some(i=>i.sp.lv===3)?20:40;
  res.feeds=Math.min(3,Math.max(...items.map(i=>i.sp.f)));
  const ord={crit:0,warn:1,info:2};res.issues.sort((a,b)=>ord[a.sev]-ord[b.sev]);
  return res;
}
function valStatus(k,v,a){
  if(v==null)return'';
  if(k==='nh3'||k==='no2')return v>=.5?'bad':v>0?'meh':'';
  if(k==='no3')return v>a.lim*2?'bad':v>a.lim?'meh':'';
  if(k==='temp'&&a.t)return(v<a.t[0]-2||v>a.t[1]+2)?'bad':(v<a.t[0]||v>a.t[1])?'meh':'';
  if(k==='ph'&&a.ph)return(v<a.ph[0]-.6||v>a.ph[1]+.6)?'bad':(v<a.ph[0]-.2||v>a.ph[1]+.2)?'meh':'';
  return'';
}

function needs(tank,S){

  if(al.length&&S.o2<.45)add('crit','o2','Los peces boquean en la superficie','Les falta oxígeno: el agua caliente, el filtro tapado y muchos peces lo consumen. Enciende el aireador y revisa el filtro.','air');

  if(al.length&&!(S.power>0)){const hun=avg(al,'hun');if(hun>55)add(hun>85?'crit':'warn','hun',hun>85?'Tus peces tienen mucha hambre':'Es hora de comer','Elige la comida y toca el agua para soltar una pizca. Da solo lo que coman en 2 minutos: lo que sobra se pudre.','food')}
  const fon=al.filter(f=>(getSp(f.sp)||{}).z==='fon'&&f.sp!=='cherry'),up=al.filter(f=>(getSp(f.sp)||{}).z!=='fon');
  if(fon.length&&up.length&&avg(fon,'hun')>60&&avg(up,'hun')<40)add('warn','bottom','Los peces de fondo no alcanzan la comida','Los de arriba se comen las hojuelas antes de que lleguen al fondo. Usa pastillas de fondo o granulado que se hunda.','food');

  for(const id in by){const sp=getSp(id);if(!sp||avg(by[id],'diet')>=40)continue;add('warn','diet'+id,`Los ${sp.n} necesitan ${sp.d==='her'?'comida vegetal':sp.d==='car'?'más proteína':'una dieta variada'}`,`Son ${DL[sp.d].toLowerCase()}s. ${sp.d==='her'?'Dales vegetal escaldado o pastillas de fondo con alga.':sp.d==='car'?'Dales artemia o granulado.':'Alterna hojuelas, granulado y algo de vegetal.'} Comer siempre lo mismo los debilita.`,'food')}
  if(S.left>6)add('warn','left','Sobró comida en el fondo','La comida que nadie come se pudre y produce amoníaco. Retírala sifoneando el fondo en el próximo cambio de agua y da menos comida.','wc');

function firstSentence(t){t=String(t||'');const m=t.match(/^.*?[.!?](\s|$)/);return(m?m[0]:t).trim()}
function quietShift(ts,urgent){if(urgent)return ts;const d=new Date(ts),h=d.getHours()+d.getMinutes()/60;if(h>=22||h<7.5){if(h>=22)d.setDate(d.getDate()+1);d.setHours(7,30,0,0);return d.getTime()}return ts}
/* Simula en una copia las próximas 72 h (el acuario corre en tiempo real mientras la app está cerrada)
   y programa avisos para el primer problema nuevo, el primer problema grave y el riesgo de muerte. */
function planNotifs(){
  const out=[],now=Date.now();PRED=true;
  try{state.core.tanks.forEach((tank,ti)=>{
    const S0=simOf(tank.id);if(!S0||!alive(S0).length)return;
    const S=clone(S0);compStress(tank,S);
    const k0={};needs(tank,S).forEach(n=>{if(n.sev!=='info'&&!NRAND.has(n.k))k0[n.k]=n.sev});
    const n0=alive(S).length,base=100+ti*10,nm=tank.name;let warn=null,crit=null,death=null;
    const pend=needs(tank,S).find(n=>n.sev==='crit'&&n.k!=='power');
    if(pend)out.push({id:base,at:now+3*36e5,tank:tank.id,title:nm+': te sigue necesitando',body:pend.t});
    for(let h=1;h<=72&&!(crit&&death);h++){
      for(let q=0;q<4;q++)simStep(tank,S,.25);
      if(!death&&alive(S).length<n0)death=h;
      const nd=needs(tank,S).filter(n=>n.sev!=='info'&&!NRAND.has(n.k)&&n.k!=='dead');
      if(!warn){const n=nd.find(x=>!k0[x.k]);if(n)warn={h,n}}
      if(!crit){const n=nd.find(x=>x.sev==='crit'&&k0[x.k]!=='crit');if(n)crit={h,n}}
    }
    if(warn&&!(crit&&crit.n.k===warn.n.k&&crit.h-warn.h<3))out.push({id:base+1,at:quietShift(now+warn.h*36e5,false),tank:tank.id,title:nm+': '+warn.n.t,body:firstSentence(warn.n.why)});
    if(crit)out.push({id:base+2,at:quietShift(now+crit.h*36e5,!!death),tank:tank.id,title:nm+': '+crit.n.t,body:firstSentence(crit.n.why)});
    if(death&&(!crit||crit.h>=death-1))out.push({id:base+3,at:now+Math.max(.5,death-4)*36e5,tank:tank.id,title:nm+': un pez está en peligro',body:'Si no lo atiendes pronto podría morir. Entra a ver qué le pasa.'});
  })}finally{PRED=false}
  return out.filter(n=>n.at>now+6e4).sort((a,b)=>a.at-b.at).slice(0,12);
}

function chartHtml(pts,band,unit){

  const xs=pts.map(p=>p.ts);const x0=Math.min(...xs),x1=Math.max(...xs);
  let vals=pts.map(p=>p.v);if(band)vals=vals.concat(band.filter(x=>x!=null));let lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi-lo<1){hi+=.5;lo-=.5}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;if(lo<0&&Math.min(...vals)>=0)lo=0;
  const X=t=>pl+(x1===x0?.5:(t-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(Hh-pt-pb);
  const bandR=band?`<rect class="ch-band" x="${pl}" y="${Y(Math.min(band[1],hi)).toFixed(1)}" width="${W-pl-pr}" height="${Math.max(0,Y(Math.max(band[0],lo))-Y(Math.min(band[1],hi))).toFixed(1)}" rx="4"/>`:'';
  const P=pts.map((p,i)=>({x:X(xs[i]),y:Y(p.v),d:p.d,v:p.v}));
  const line=P.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const area=line+` L${P[P.length-1].x.toFixed(1)} ${Hh-pb} L${P[0].x.toFixed(1)} ${Hh-pb} Z`;CH={P,unit,W,Hh};
  return`<svg id="ch-svg" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gráfica"><defs><linearGradient id="chg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#40E0E8" stop-opacity=".38"/><stop offset="1" stop-color="#40E0E8" stop-opacity="0"/></linearGradient></defs>${bandR}
  ${[lo,(lo+hi)/2,hi].map(v=>`<line class="ch-grid" x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ch-txt" x="${pl-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${fmtN(Math.round(v*10)/10)}</text>`).join('')}
  <path d="${area}" fill="url(#chg)"/><path class="ch-line draw" pathLength="1" d="${line}"/>${P.length<=40?P.map(p=>`<circle class="ch-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2"/>`).join(''):''}
  <text class="ch-txt" x="${pl}" y="${Hh-6}">${esc(pts[0].d)}</text><text class="ch-txt" x="${W-pr}" y="${Hh-6}" text-anchor="end">${esc(pts[pts.length-1].d)}</text>
  <g><line id="ch-tl" class="ch-cross" y1="${pt-4}" y2="${Hh-pb}"/><circle id="ch-tc" r="6" fill="#40E0E8" stroke="#E8F7F8" stroke-width="2"/><rect id="ch-tr" class="ch-tipbg" rx="7" height="22" y="2"/><text id="ch-tt" class="ch-tiptxt" y="17"></text></g></svg>`;
}
function chartTip(i){if(!CH||!$('#ch-svg'))return;const p=CH.P[clamp(i,0,CH.P.length-1)];const txt=`${fmtN(p.v)}${CH.unit?' '+CH.unit:''} · ${p.d}`;const w=txt.length*6.8+16;const x=clamp(p.x-w/2,2,CH.W-w-2);
  $('#ch-tl').setAttribute('x1',p.x);$('#ch-tl').setAttribute('x2',p.x);$('#ch-tc').setAttribute('cx',p.x);$('#ch-tc').setAttribute('cy',p.y);$('#ch-tr').setAttribute('x',x);$('#ch-tr').setAttribute('width',w);$('#ch-tt').setAttribute('x',x+8);$('#ch-tt').textContent=txt}

function spark(vals,lo,hi,band,col){const W=150,H=44;if(vals.length<2)return'<div class="hint" style="height:44px;display:grid;place-items:center">Aún sin datos</div>';const X=i=>i/(vals.length-1)*W,Y=v=>H-3-(clamp(v,lo,hi)-lo)/((hi-lo)||1)*(H-6);const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');

function speciesList(){

    if(ui.filt==='easy')return s.lv===1;if(ui.filt==='cold')return s.cold;if(ui.filt==='nat')return s.nat;if(ui.filt==='school')return s.g>=6;if(ui.filt==='small')return s.L<=60;return true});

function viewGuia(){

function doWC(p,sif,cond,same){
  const tank=curTank(),S=simOf(tank.id),st=set();
  const k=1-p;S.nh3*=k;S.no2*=k;S.no3*=k;S.cl*=k;S.medH=S.medH*k;
  S.waste*=sif?(1-Math.min(.9,p*1.7)):(1-p*.2);S.left*=sif?.1:.8;
  S.lastWC=S.simH;S.ph=S.ph*k+(Number(st.tapPh)||7.2)*p;S.kh=S.kh*k+(Number(st.tapKh)||4)*p;S.level=100;
  const tapT=(Number(st.room)||22)-2;const nt=same?S.temp:S.temp*k+tapT*p;const dT=Math.abs(S.temp-nt);S.temp=nt;
  const lessons=[];
  if(!cond){S.cl+=p*1.3;lessons.push('Olvidaste el acondicionador: el cloro dañó las bacterias del filtro y las branquias de los peces.')}
  if(dT>1.5){alive(S).forEach(f=>f.hp=Math.max(1,f.hp-dT*5));lessons.push(`El agua nueva estaba más fría: la temperatura bajó ${fmtN(dT,1)} °C de golpe y los peces se estresaron.`)}
  if(p>.5){alive(S).forEach(f=>f.hp=Math.max(1,f.hp-(p-.5)*40));lessons.push('Cambiaste mucha agua de golpe: el cambio brusco estresa a los peces. Mejor cambios de 20 a 30% más seguidos.')}
  sfx('plop');const pc=Math.round(p*100);
  if(!lessons.length&&p>=.15){stat('goodWc');addXP(sif?20:14);diary(tank,S,'ok',`Cambio de agua del ${pc}%`,sif?'Sifoneaste el fondo y usaste acondicionador a la misma temperatura. Así se hace.':'Bien hecho. La próxima vez sifonea también la grava para sacar la suciedad.');toast('¡Cambio de agua bien hecho!','bucket');setTimeout(()=>{STAGE&&STAGE.celebrate()},600)}
  else{stat('badWc');addXP(4);diary(tank,S,'warn',`Cambio de agua del ${pc}% con errores`,lessons.join(' ')||'Un cambio tan pequeño casi no baja los nitratos: lo útil es entre 20 y 30%.');toast(lessons[0]||'Un cambio tan pequeño casi no ayuda.','alert');sfx('bad')}
  closeSheet();act();
}

  if(id==='pl-name')S_.name=t.value;
  if(id==='ht-set'){const S=simOf(ui.tankId);S.setT=Number(t.value);$('#ht-v').textContent=fmtN(S.setT,1)+' °C';simDirty=true}
  if(['tf-cl','tf-cw','tf-ch'].includes(id)){const l=pnum($('#tf-cl').value),w=pnum($('#tf-cw').value),h=pnum($('#tf-ch').value);if(l&&w&&h){const L=Math.round(l*w*h/1000*.85);$('#tf-L').value=L;$('#tf-calc').textContent=`${fmtN(Math.round(l*w*h/1000))} L de vidrio → unos ${L} L de agua real.`}}
  if(id==='st-name'){set().name=t.value.trim().slice(0,24);clearTimeout(S_.st);S_.st=setTimeout(()=>{queueSave(['core']);if(!ui.sheet||ui.sheet.type!=='settings')render()},600)}
  if(['st-room','st-ph','st-kh'].includes(id)){const st=set();const v=pnum(t.value);if(v!=null){if(id==='st-room')st.room=clamp(v,10,35);if(id==='st-ph')st.tapPh=clamp(v,5,9);if(id==='st-kh')st.tapKh=clamp(v,0,20)}clearTimeout(S_.st);S_.st=setTimeout(()=>queueSave(['core']),600)}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='st-notif')natEnable(t.checked);
  if(id==='st-rem'){lsSet('ba-rem',t.value);natResume();toast(Number(t.value)<0?'Sin recordatorio diario.':'Recordatorio diario guardado.','clock')}
  if(id==='st-sound'){SND.on=t.checked;lsSet('ba-sound',SND.on?'1':'0');if(SND.on)sfx('tick')}
  if(id==='ht-on'){const S=simOf(ui.tankId);S.heater=t.checked;act();renderSheet()}
  if(id==='ht-set'){act()}
  if(id==='ff-acc'&&ui.sheet)ui.sheet.acc=t.checked;
  if(id==='fp-name'){const S=simOf(ui.tankId),f=S&&S.fish.find(x=>x.id===ui.fpop);if(f){const nm=t.value.trim().slice(0,20);if(nm!==f.name){f.name=nm;if(nm){addXP(2);toast(`Ahora se llama ${nm}.`,'heart')}act()}}}
  if(id==='import-in'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{let d=null;try{d=JSON.parse(fr.result)}catch(x){}const box=$('#st-imp');if(!box)return;
    if(!d||!d.core||!Array.isArray(d.core.tanks)){box.innerHTML='<p class="err">Ese archivo no es una copia de Mi Primer Acuario.</p>';return}
    ui.sheet.imp=d;box.innerHTML=`${alertHtml({sev:'warn',msg:`Esto reemplaza tus acuarios actuales por los de la copia (${plural(d.core.tanks.length,'acuario','acuarios')}).`})}<div class="row" style="margin-top:8px"><button class="btn danger" data-act="imp-yes">Reemplazar</button><button class="btn" data-act="imp-no">Cancelar</button></div>`};fr.readAsText(t.files[0])}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,S_=ui.sheet;
  if(f.id==='tank-form'){
    const name=$('#tf-name').value.trim(),L=pnum($('#tf-L').value),planted=$('#tf-planted').checked,err=$('#tf-err');
    if(!name){err.textContent='Escribe un nombre para el acuario.';$('#tf-name').focus();return}
    if(!L||L<5||L>5000){err.textContent='Escribe los litros del acuario (entre 5 y 5000).';$('#tf-L').focus();return}
    if(S_.id){const t=tankById(S_.id);Object.assign(t,{name,L,planted});const S=simOf(t.id);if(planted&&!S.plants)S.plants=40;ui.sheet=null;$('#sheet').innerHTML='';document.body.classList.remove('locked');act();toast('Cambios guardados.','check');return}
    createTank(name,L,planted,S_.cyc!==0,[]);ui.sheet=null;$('#sheet').innerHTML='';document.body.classList.remove('locked');ui.tab='acuario';ui.enter=true;lsSet('ba-tab4','acuario');act();toast('¡Acuario listo! Ahora agrega tus peces.','sparkle');setTimeout(()=>openSheet({type:'fish',q:'',count:null,acc:true}),500);return;
  }
  if(f.id==='fish-form'){if(!S_.sp)return;const n=clamp(S_.count||1,1,60),acc=$('#ff-acc').checked;addFish(S_.sp,n,acc);ui.sheet=null;$('#sheet').innerHTML='';document.body.classList.remove('locked');sfx('plop');act();toast(`${n} ${getSp(S_.sp).n} ya nadan en tu acuario.`,'fish');return}
});
document.addEventListener('pointermove',e=>{if(e.target.closest&&e.target.closest('#ch-svg'))chartPointer(e)});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#ch-svg'))chartPointer(e)});
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-grab]');if(!g)return;drag={y:e.clientY,sh:g.closest('.sheet'),dy:0};try{g.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.dy=Math.max(0,e.clientY-drag.y);drag.sh.style.transform=`translateY(${drag.dy}px)`});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.dy>90)closeSheet();else{d.sh.style.transition='transform .25s';d.sh.style.transform='';setTimeout(()=>{if(d.sh)d.sh.style.transition=''},260)}});
document.addEventListener('keydown',e=>{
  if(!ui.sheet)return;if(e.key==='Escape'){closeSheet();return}
  if(e.key==='Tab'){const f=$$('#sheet button:not([disabled]),#sheet input:not([type=hidden]),#sheet select,#sheet textarea,#sheet summary').filter(x=>x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
init();
</script>
